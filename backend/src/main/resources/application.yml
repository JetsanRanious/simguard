spring:
  application:
    name: simguard-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:simguard}
    username: ${DB_USER:simguard}
    password: ${DB_PASSWORD:simguard}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8080

simguard:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production}
    expiry-minutes: 30
